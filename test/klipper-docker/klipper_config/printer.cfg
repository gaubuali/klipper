[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 1000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: ar54
dir_pin: ar55
enable_pin: !ar38
rotation_distance: 40
microsteps: 16
position_max: 200
endstop_pin: ar3
position_endstop: 0
homing_speed: 50

[stepper_y]
step_pin: ar60
dir_pin: ar61
enable_pin: !ar56
rotation_distance: 40
microsteps: 16
position_max: 200
endstop_pin: ar14
position_endstop: 0
homing_speed: 50

[stepper_z]
step_pin: ar46
dir_pin: ar48
enable_pin: !ar62
rotation_distance: 8
microsteps: 16
position_max: 200
endstop_pin: ar18
position_endstop: 0.5
homing_speed: 25

[extruder]
step_pin: ar26
dir_pin: ar28
enable_pin: !ar24
rotation_distance: 33.5
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ar10
sensor_type: EPCOS 100K B57560G104F
sensor_pin: ar13
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: ar8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: ar12
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 110

[heater_fan my_fan]
pin: ar7

[fan]
pin: ar4

[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[idle_timeout]

[respond]

[gcode_macro START_PRINT]
gcode:
    G28
    M117 Starting print...

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT
    G91
    G1 Z10 F300
    G90
    G1 X0 Y0 F3000
    M84
    M106 S0
    M117 Print canceled

[gcode_macro END_PRINT]
gcode:
    M104 S0
    M140 S0
    G91
    G1 Z10 F300
    G90
    M84
    M117 Done
