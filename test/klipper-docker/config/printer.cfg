# Basic printer configuration for Klipper
# Adjust values for your specific printer

[stepper_x]
step_pin: PC0
dir_pin: !PC1
enable_pin: !PC2
step_distance: .0125
endstop_pin: ^PA5
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PC3
dir_pin: !PC4
enable_pin: !PC5
step_distance: .0125
endstop_pin: ^PA6
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PC6
dir_pin: PC7
enable_pin: !PC8
step_distance: .0025
endstop_pin: ^PA7
position_endstop: 0.0
position_min: -2
position_max: 250
homing_speed: 4.0

[stepper_z1]
step_pin: PB3
dir_pin: PB4
enable_pin: !PB5

[stepper_z2]
step_pin: PB6
dir_pin: PB7
enable_pin: !PB8

[extruder]
step_pin: PB0
dir_pin: PB1
enable_pin: !PB2
step_distance: .002401
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA3
control: pid
pid_Kp: 52.3
pid_Ki: 0.6
pid_Kd: 850
min_temp: 0
max_temp: 110

[heater_fan my_fan]
pin: PB6

[fan]
pin: PB7

[mcu]
serial: /dev/ttyUSB0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 1000
max_z_velocity: 5
max_z_accel: 100

[display]
lcd_type: uc1701
cs_pin: PA4
a0_pin: PA6
encoder_pins: ^PB1, ^PB3
click_pin: ^!PA5

[bltouch]
sensor_pin: ^PA7
control_pin: PA8
x_offset: -44
y_offset: -9
z_offset: 1.5

[bed_screws]
screw1: 25, 25
screw2: 210, 25
screw3: 210, 210
screw4: 25, 210
